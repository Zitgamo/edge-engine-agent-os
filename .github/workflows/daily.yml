name: Daily Pipeline

on:
  schedule:
    # GitHub cron is UTC. Try during the morning and again at
    # 16:17, 17:17 and 18:17 Vietnam time so the post-close EOD bar is picked up.
    # The offset minute avoids the highest-load :00 boundary; the pipeline's
    # market-date guard makes later attempts idempotent.
    - cron: "17 1-3,9-11 * * 1-5"
  workflow_dispatch:

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run full pipeline
        run: python -m src.cli pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: Show signal
        run: python -m src.cli signal
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - name: Show performance
        run: python -m src.cli summary
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - name: Syntax smoke check
        run: |
          python -m compileall -q src tests
          ruff check src tests
      - name: Run tests
        run: pytest -q
      - name: Persist fresh raw market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u data/raw
          if test -f data/raw/VNINDEX_raw.parquet; then git add data/raw/VNINDEX_raw.parquet; fi
          if git diff --cached --quiet; then
            echo "No raw market data changes"
          else
            git commit -m "chore: refresh raw market data"
            git push origin HEAD:master
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: database
          path: data/engine.db
      - uses: actions/upload-artifact@v4
        with:
          name: ranking
          path: data/processed/ranking.parquet
          if-no-files-found: ignore

  run-paper-candidate:
    needs: run-pipeline
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Restore paper OHLC cache
        uses: actions/cache@v4
        with:
          path: data/paper_raw
          key: paper-raw-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            paper-raw-${{ runner.os }}-
      - name: Refresh KBS paper candidate
        run: python -m src.cli paper-update
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: Show paper readiness
        run: python -m src.cli paper-test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
