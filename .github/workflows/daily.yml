name: Daily Pipeline

on:
  schedule:
    # GitHub cron is UTC. Try at 08:17, 09:17 and 10:17 Vietnam time so a
    # delayed first run or late Yahoo close is picked up automatically.
    # The offset minute avoids the highest-load :00 boundary; the pipeline's
    # market-date guard makes later attempts idempotent.
    - cron: "17 1,2,3 * * 1-5"
  workflow_dispatch:

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run full pipeline
        run: python -m src.cli pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: Show signal
        run: python -m src.cli signal
      - name: Show performance
        run: python -m src.cli summary
      - name: Syntax smoke check
        run: |
          python -m compileall -q src tests
          ruff check src tests --select E9
      - name: Run tests
        run: pytest -q
      - name: Persist fresh raw market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u data/raw
          if test -f data/raw/VNINDEX_raw.parquet; then git add data/raw/VNINDEX_raw.parquet; fi
          if git diff --cached --quiet; then
            echo "No raw market data changes"
          else
            git commit -m "chore: refresh raw market data"
            git push origin HEAD:master
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: database
          path: data/engine.db
      - uses: actions/upload-artifact@v4
        with:
          name: ranking
          path: data/processed/ranking.parquet
