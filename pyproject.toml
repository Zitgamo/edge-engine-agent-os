[project]
name = "edge_engine_agent_os"
version = "0.1.0"
description = "VN stock ranking platform with multi-horizon outperformance models and T+20 tracking"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "xgboost>=2.0",
    "scikit-learn>=1.3",
    "streamlit>=1.28",
    "protobuf>=4.25.8,<6",
    "plotly>=5.15",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "yfinance>=1.5",
    "pyarrow>=15.0",
    "vnstock>=4.0,<5.0",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "black>=23.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# Streamlit pages bootstrap sys.path before importing project modules, and
# several model modules intentionally keep late imports to avoid cycles.
ignore = ["E402"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
